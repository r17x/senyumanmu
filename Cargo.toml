[workspace]
resolver = "2"
members = [
  "cam-affect",
  "cam-demo",
  "cam-gpu",
  "cam-signal",
  "cam-test",
  "cam-vision",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "deny"
dead_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-core-graphics = "0.3"
thiserror = "2"
cam-affect = { path = "cam-affect" }
cam-gpu = { path = "cam-gpu" }
cam-signal = { path = "cam-signal" }
cam-vision = { path = "cam-vision" }
objc2-vision = "0.3"
objc2-core-video = "0.3"
objc2-core-foundation = "0.3"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
strip = "debuginfo"
